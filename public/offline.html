<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — CONROY</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #f4f1ea;
        color: #171717;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      .mark { font-size: 1.25rem; letter-spacing: 0.3em; font-weight: 600; }
      h1 { margin: 2rem 0 0.75rem; font-size: 1.5rem; font-weight: 500; }
      p { margin: 0; max-width: 32ch; line-height: 1.6; color: #525252; }
      button {
        margin-top: 2rem;
        height: 3rem;
        padding: 0 1.5rem;
        border: 1px solid #171717;
        background: transparent;
        color: #171717;
        font: inherit;
        font-size: 0.78rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        cursor: pointer;
      }
      button:hover { background: #171717; color: #fff; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">CONROY</div>
      <h1>You&rsquo;re offline</h1>
      <p>This page needs a connection. Your cart is saved on this device and will be waiting.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
